<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Document Hub</title>
    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 300px;
            background: var(--card);
            border-right: 1px solid var(--border);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .main-content {
            flex: 1;
            padding: 2rem;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        h1 { font-size: 1.5rem; margin: 0; color: var(--primary); }
        h2 { font-size: 1rem; margin: 0 0 1rem 0; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.05em; }

        .upload-card {
            background: var(--card);
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            transition: border-color 0.2s;
        }

        .upload-card:hover { border-color: var(--primary); }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { background: var(--text-light); cursor: not-allowed; }

        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            background: var(--card);
            padding: 0.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        input[type="text"] {
            flex: 1;
            border: none;
            padding: 0.75rem;
            font-size: 1rem;
            outline: none;
        }

        #answerArea {
            background: var(--card);
            border-radius: 12px;
            padding: 2rem;
            border: 1px solid var(--border);
            min-height: 300px;
            line-height: 1.6;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
        }

        /* Markdown Styling */
        #answerArea h1, #answerArea h2, #answerArea h3 { color: var(--text); margin-top: 1.5rem; }
        #answerArea ul, #answerArea ol { padding-left: 1.5rem; }
        #answerArea code { background: #f1f5f9; padding: 0.2rem 0.4rem; border-radius: 4px; font-family: monospace; }
        #answerArea blockquote { border-left: 4px solid var(--primary); margin: 0; padding-left: 1rem; font-style: italic; color: var(--text-light); }

        .status-msg { font-size: 0.875rem; margin-top: 0.5rem; }
        .success { color: var(--success); }
        .error { color: #ef4444; }
        .loading-spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="sidebar">
        <div>
            <h1>AI Doc Hub</h1>
            <p style="font-size: 0.875rem; color: var(--text-light)">Context-Aware Q&A</p>
        </div>

        <div class="upload-section">
            <h2>Source Document</h2>
            <div class="upload-card">
                <input type="file" id="fileInput" accept=".pdf,.docx,.txt" style="display: none">
                <label for="fileInput" id="fileLabel" style="cursor: pointer; display: block; margin-bottom: 1rem;">
                    <span style="font-size: 2rem;">📄</span><br>
                    <span style="color: var(--primary); font-weight: 500;">Click to select file</span>
                </label>
                <button id="uploadBtn" class="btn">Upload Document</button>
                <p id="uploadStatus" class="status-msg"></p>
            </div>
        </div>

        <div style="margin-top: auto; font-size: 0.75rem; color: var(--text-light);">
            Powered by OpenRouter & Local Embeddings
        </div>
    </div>

    <div class="main-content">
        <div class="chat-container">
            <div id="answerArea">
                <div style="color: var(--text-light); text-align: center; margin-top: 5rem;">
                    <span style="font-size: 3rem;">👋</span>
                    <h3>Ready to help!</h3>
                    <p>Upload a document and ask me anything about it.</p>
                </div>
            </div>

            <div class="input-group">
                <input type="text" id="questionInput" placeholder="Ask a question about your document...">
                <button id="askBtn" class="btn" style="width: auto;">Ask AI</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:5000';

        const uploadBtn = document.getElementById('uploadBtn');
        const fileInput = document.getElementById('fileInput');
        const fileLabel = document.getElementById('fileLabel');
        const uploadStatus = document.getElementById('uploadStatus');
        const askBtn = document.getElementById('askBtn');
        const questionInput = document.getElementById('questionInput');
        const answerArea = document.getElementById('answerArea');

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                fileLabel.innerHTML = `<span style="font-size: 2rem;">✅</span><br><strong>${fileInput.files[0].name}</strong>`;
            }
        });

        uploadBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) {
                showStatus(uploadStatus, 'Please select a file.', 'error');
                return;
            }

            setLoading(uploadBtn, true, 'Processing...');
            showStatus(uploadStatus, 'Uploading and indexing...', '');

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(`${API_BASE_URL}/api/upload`, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const result = await response.json();
                    showStatus(uploadStatus, 'Ready! Document indexed.', 'success');
                } else {
                    showStatus(uploadStatus, 'Upload failed.', 'error');
                }
            } catch (error) {
                showStatus(uploadStatus, 'Network error.', 'error');
            } finally {
                setLoading(uploadBtn, false, 'Upload Document');
            }
        });

        askBtn.addEventListener('click', async () => {
            const question = questionInput.value.trim();
            if (!question) return;

            setLoading(askBtn, true, 'Thinking...');
            answerArea.style.opacity = '0.5';

            try {
                const response = await fetch(`${API_BASE_URL}/api/ask`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });

                if (response.ok) {
                    const result = await response.json();
                    // Use Marked to render markdown
                    answerArea.innerHTML = marked.parse(result.answer || 'No answer received.');
                } else {
                    answerArea.innerHTML = '<p class="error">Failed to get answer from AI.</p>';
                }
            } catch (error) {
                answerArea.innerHTML = '<p class="error">Network error. Is the backend running?</p>';
            } finally {
                setLoading(askBtn, false, 'Ask AI');
                answerArea.style.opacity = '1';
                questionInput.value = '';
            }
        });

        // Helper functions
        function setLoading(btn, isLoading, text) {
            btn.disabled = isLoading;
            btn.innerHTML = isLoading ? `<span class="loading-spinner"></span>${text}` : text;
        }

        function showStatus(el, msg, type) {
            el.textContent = msg;
            el.className = 'status-msg ' + type;
        }

        // Allow 'Enter' key to ask question
        questionInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') askBtn.click();
        });
    </script>
</body>
</html>
